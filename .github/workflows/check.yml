# 플러그인 등록 PR 자동 검사 (본보기 — 앱 저장소 server/registry-template/ 에서 복사)
# 검사 코드는 앱 저장소 server/src/plugins/registry/check.ts. 플러그인 코드는 실행하지 않는다.
# pull_request(포크 PR 에 쓰기 권한·비밀값 없음)로 돈다 — pull_request_target 으로 바꾸지 않는다.
# `check` 는 main 보호 규칙의 필수 검사다. 필수 검사는 모든 PR 에서 결과를 내야 하므로 `paths:` 로 거르지 않는다 —
# 거르면 plugins/ 를 안 건드린 PR(README 고치기 등)은 검사가 영영 '대기'라 병합이 막힌다(GitHub 동작).
# 대신 늘 돌고, plugins/ · icons/ 가 병합 대상과 같으면 검사를 건너뛰고 통과한다.
name: 플러그인 검사

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 이 PR 의 레지스트리
        uses: actions/checkout@v7
        with:
          path: head

      - name: 병합 대상 레지스트리 (올린 버전 비교용)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: plugins/ · icons/ 가 바뀌었나
        id: changes
        run: |
          same() { { [ ! -e "base/$1" ] && [ ! -e "head/$1" ]; } || diff -rq "base/$1" "head/$1" > /dev/null 2>&1; }
          if [ -d head/plugins ] && [ -d base/plugins ] && same plugins && same icons; then
            echo "plugins/ · icons/ 가 그대로다 — 검사를 건너뛰고 통과한다"
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          else
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 검사 코드 (PromBoard 앱 저장소)
        if: steps.changes.outputs.plugins == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PROMBOARD_APP_REPOSITORY || 'guru99251/promboard' }}
          ref: ${{ vars.PROMBOARD_APP_REF || 'local/master' }}
          token: ${{ secrets.PROMBOARD_APP_TOKEN || github.token }}
          path: app
          sparse-checkout: server

      - if: steps.changes.outputs.plugins == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 의존성 (네이티브 빌드 없이)
        if: steps.changes.outputs.plugins == 'true'
        working-directory: app/server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 검사
        if: steps.changes.outputs.plugins == 'true'
        working-directory: app/server
        run: npx tsx src/tools/registry.ts check --registry "$GITHUB_WORKSPACE/head" --base "$GITHUB_WORKSPACE/base"
