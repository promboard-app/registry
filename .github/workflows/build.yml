# registry.json 만들기 (본보기 — 앱 저장소 server/registry-template/ 에서 복사)
# main 에 병합될 때와 하루 한 번(Star·다운로드 수 갱신) 돈다. 내용이 같으면(generatedAt 만 다르면) 커밋하지 않는다.
# GITHUB_TOKEN 으로 한 푸시는 다른 워크플로를 깨우지 않아 되풀이되지 않는다.
name: registry.json 만들기

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 레지스트리
        uses: actions/checkout@v7
        with:
          path: registry

      - name: 빌드 코드 (PromBoard 앱 저장소)
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PROMBOARD_APP_REPOSITORY || 'guru99251/promboard' }}
          ref: ${{ vars.PROMBOARD_APP_REF || 'local/master' }}
          token: ${{ secrets.PROMBOARD_APP_TOKEN || github.token }}
          path: app
          sparse-checkout: server

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 의존성 (네이티브 빌드 없이)
        working-directory: app/server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: registry.json 만들기
        working-directory: app/server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx src/tools/registry.ts build --registry "$GITHUB_WORKSPACE/registry" --out "$GITHUB_WORKSPACE/registry/registry.json"

      - name: 바뀌었으면 커밋
        working-directory: registry
        run: |
          git add registry.json
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "registry.json 갱신"
          git push
